<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Age Checker</title>
    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body class="bg-primary d-flex p-5 justify-content-center">
    <div class="div card  p-5 bg-warning" >
      <div
        class="d-flex justify-content-center align-items-center flex-column bg-warning"
      >
        <label for="exampleInputEmail1" class="form-label h2 text-center"
          >Age Checker</label
        >
        <input
          type="number"
          class="form-control mb-3"
          id="age"
          aria-describedby="emailHelp"
        />
        <button onclick="checkAge()" class="btn btn-primary w-50 text-center">
          Submit
        </button>
      </div>
    </div>

    <script>
      function checkAge() {
        var age = document.getElementById("age").value;
        
        // (age>=18)? alert("eligible"):alert("not eligible")
        if (age >= 18) {
          alert("eligible");
        } else {
          alert("not eligible");
        }
      }
    </script>
  </body>
</html>
